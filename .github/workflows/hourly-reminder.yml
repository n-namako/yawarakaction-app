name: Hourly reminder trigger

on:
  schedule:
    # 毎時0分（UTC）に実行。Vercel Hobbyプランのcron制限（1日1回まで）を回避するため、
    # GitHub Actionsから直接エンドポイントを叩く。
    - cron: "0 * * * *"
  workflow_dispatch: {}

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - name: Call daily-reminder endpoint
        run: |
          curl -sf -X GET "https://yawarakaction-app.vercel.app/api/cron/daily-reminder" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}"
